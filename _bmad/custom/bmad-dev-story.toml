# Team overrides for bmad-dev-story workflow.
# Committed to the repo — applies to every developer on the project.

[workflow]

# After discovering the story key in Step 1, and before marking it in-progress (Step 4),
# create and switch to a dedicated git branch for the story.
activation_steps_append = [
  "When you reach Step 4 (mark story in-progress), BEFORE updating sprint-status, create a git branch for this story: run `git checkout -b story/{story_key}`. If that branch already exists, run `git checkout story/{story_key}` instead. Confirm the branch is active before proceeding with implementation.",
]

# After marking the story 'review', commit all changes and open a PR.
on_complete = "After the story status is set to 'review', do the following in order: (1) Stage all changed files with `git add` (list specific files from the File List section — do not use git add -A). (2) Commit with message 'Story {story_key}: {story_title}\\n\\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>'. (3) Push the branch: `git push -u origin story/{story_key}`. (4) Create a pull request: `gh pr create --base main --head story/{story_key} --title 'Story {story_key}: {story_title}' --body 'Implements story {story_key}.\\n\\nSee story file for full details and acceptance criteria.'`. (5) Report the PR URL to the user."
