# Team overrides for bmad-dev-story workflow.
# Committed to the repo — applies to every developer on the project.

[workflow]

# After discovering the story key in Step 1, and before marking it in-progress (Step 4),
# create and switch to a dedicated git branch for the EPIC (not the story).
# All stories belonging to the same epic commit to the same branch.
activation_steps_append = [
  "When you reach Step 4 (mark story in-progress), BEFORE updating sprint-status, create and link a git branch for this story's epic: (1) Extract the epic number from {story_key} (the first number before the first dash). (2) Find the GitHub epic issue number and title by running: `gh issue list --label epic --search \"Epic {epic_num}:\" --json number,title --jq '.[0]'`. Store the issue number as epic_issue_number. Derive epic_slug from the title: take the text after 'Epic {epic_num}: ', lowercase it, replace spaces and non-alphanumeric characters with hyphens, collapse consecutive hyphens to one, strip leading/trailing hyphens, truncate to 40 characters. The full branch name is epic/{epic_num}-{epic_slug} (e.g. epic/12-yin-pitch-detector). (3) If the branch epic/{epic_num}-{epic_slug} does not exist yet, create it linked to the GitHub issue: `gh issue develop {epic_issue_number} --name epic/{epic_num}-{epic_slug} --checkout`. If the branch already exists, simply switch to it: `git checkout epic/{epic_num}-{epic_slug}`. (4) Confirm the branch is active before proceeding with implementation.",
]

# After marking the story 'review', commit all changes and open a PR (if not already on the epic branch).
on_complete = "After the story status is set to 'review', do the following in order: (1) Extract epic number from {story_key} (first number before dash). (2) Derive the branch name: get the epic title via `gh issue list --label epic --search \"Epic {epic_num}:\" --json title --jq '.[0].title'`, then slugify the text after 'Epic {epic_num}: ' (lowercase, spaces/non-alphanumeric → hyphens, collapse, strip, truncate to 40 chars). Branch name = epic/{epic_num}-{epic_slug}. (3) Verify you are on branch epic/{epic_num}-{epic_slug} (`git branch` to check). If not, switch to it: `git checkout epic/{epic_num}-{epic_slug}`. (4) Stage all changed files with `git add` (list specific files from the File List section — do not use git add -A). (5) Commit with message 'Story {story_key}: {story_title}\\n\\nCo-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>'. (6) Push to epic branch: `git push -u origin epic/{epic_num}-{epic_slug}`. (7) If this is the first story on this epic branch, create a pull request: `gh pr create --base main --head epic/{epic_num}-{epic_slug} --title 'Epic {epic_num}: [Epic Name]' --body 'Implements epic {epic_num} stories.\\n\\nStories: {story_key}\\n\\nSee implementation artifacts for full details.'`. If the PR already exists, just mention this story in the existing PR description. (8) Report the PR URL to the user."
