name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install JS dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: JS unit tests
        run: npx vitest run --reporter=verbose tests/unit/js

      - name: Python unit tests
        run: python -m pytest tests/unit/ -v

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install JS dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: JS integration tests
        run: npx vitest run --reporter=verbose tests/integration

      - name: Python integration tests
        run: python -m pytest tests/integration/ --ignore=tests/integration/game_loop.test.js -v

  # E2E tests are resource-intensive (Docker + Playwright + Three.js rendering)
  # and are run manually locally rather than automatically in CI.
