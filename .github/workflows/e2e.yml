name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Slopsmith image
        run: docker buildx build https://github.com/byrongamatos/slopsmith.git#477d22068cbc -t slopsmith-dev

      - name: Start container
        run: docker compose -f tests/e2e/docker-compose.dev.yml up -d --wait
        timeout-minutes: 2

      - name: Wait for container health
        run: |
          for i in {1..10}; do
            curl -sf http://localhost:8000 && break || sleep 3
          done

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/results/report.json

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/

      - name: Teardown container
        if: always()
        run: docker compose -f tests/e2e/docker-compose.dev.yml down -v
