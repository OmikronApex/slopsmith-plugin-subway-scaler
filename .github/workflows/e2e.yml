name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Slopsmith image (cached)
        uses: docker/build-push-action@v6
        with:
          context: "https://github.com/byrongamatos/slopsmith.git#477d22068cbc81fa5bf7485b04e24d60bdb5d735"
          tags: slopsmith-dev:latest
          load: true
          cache-from: type=gha,scope=slopsmith
          cache-to: type=gha,mode=max,scope=slopsmith

      - name: Start container
        run: docker compose -f tests/e2e/docker-compose.dev.yml up -d
        timeout-minutes: 2

      - name: Wait for container to be healthy
        run: |
          for i in {1..20}; do
            if curl -Lsf --max-time 5 http://localhost:8000 > /dev/null 2>&1; then
              echo "Container ready after ${i} attempts"
              exit 0
            fi
            echo "Attempt $i/20 — waiting 3s..."
            sleep 3
          done
          echo "Container did not become healthy in time"
          docker compose -f tests/e2e/docker-compose.dev.yml logs
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          CI: true

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/results/report.json

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: tests/e2e/screenshots/

      - name: Teardown container
        if: always()
        run: docker compose -f tests/e2e/docker-compose.dev.yml down -v
